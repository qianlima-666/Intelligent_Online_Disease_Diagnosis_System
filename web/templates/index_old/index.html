<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<title>智慧在线疾病问诊系统（Intelligent Online Disease Diagnosis System） </title>
	<link rel="stylesheet" type="text/css" href="./css/style.css"/>
	<script src="./js/jquery.min.js"></script>
</head>
<body>
	<div id="app" class="container">
		<div class="header">
			<h1>智慧在线疾病问诊系统（Intelligent Online Disease Diagnosis System）</h1>
			<button type="button" onclick="empty()">清空</button>
		</div>
		<div id="chat-box" class="chat-box" onload="scrollToBottom()">
			<div></div>
			<div></div>
		</div>
		<div class="input-box">
			<input id="message" type="text" placeholder="输入消息">
			<button onclick="sending()">发送</button>
		</div>
	</div>
</body>
<script src="./js/script.js"></script>
